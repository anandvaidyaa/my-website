# Builds the site and deploys it to GitHub Pages (https://anandvaidya.in).
# Runs on every push to main, and can be run by hand from the Actions tab.
# Recommended setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net while the Pages source is still "Deploy from a branch": GitHub's own branch
  # deploy publishes the raw repository (no /projects/ pages) and can finish after this
  # workflow. It fires page_build when it's done, so we redeploy the built site on top of it.
  # Once the source is "GitHub Actions" there is no branch deploy and this never fires.
  page_build:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Build CSS/JS and assemble _site
        run: npm run build:site
        env:
          # Optional: Settings → Secrets and variables → Actions → Variables → GSC_VERIFICATION
          # (only the token from Search Console's "HTML tag" method, not the whole <meta> tag)
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
